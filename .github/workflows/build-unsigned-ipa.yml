name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Find project
        run: |
          find . -maxdepth 3 -name "*.xcodeproj" -print
          find . -maxdepth 3 -name "Package.swift" -print

      - name: Build
        run: |
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" -print -quit)
          xcodebuild \
            -project "$PROJECT" \
            -scheme RussellKestrel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive \
            -archivePath "$RUNNER_TEMP/RussellKestrel.xcarchive"

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/RussellKestrel.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r RussellKestrel-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RussellKestrel-Unsigned-IPA
          path: ${{ runner.temp }}/RussellKestrel-Unsigned.ipa
