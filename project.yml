name: RussellKestrel
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RussellKestrel:
    type: application
    platform: iOS
    sources:
      - path: RussellKestrel
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.russell.kestrel
        PRODUCT_NAME: RussellKestrel
        INFOPLIST_FILE: RussellKestrel/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: RussellKestrel/Info.plist
      properties:
        CFBundleDisplayName: Russell Kestrel
        CFBundleName: RussellKestrel
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Russell Kestrel connects to your Kestrel DVR on your network."
        NSMicrophoneUsageDescription: "Used for optional two-way audio when supported by the DVR/camera."
        NSCameraUsageDescription: "Used only for optional two-way talk when supported by the DVR/camera."
        UIBackgroundModes:
          - audio
